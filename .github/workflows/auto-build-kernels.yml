name: Auto Build Upstream Kernels (HarmonyOS arm64-v8a)

on:
  schedule:
    # Check upstream / user fork releases every 12 hours (UTC)
    - cron: '15 */12 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even when upstream versions match kernels-latest'
        required: false
        default: 'false'
        type: boolean
      xray_rust_ref:
        description: 'Override xray-rust ref/tag (leave empty for latest release/tag)'
        required: false
        default: ''
        type: string
      xray_core_ref:
        description: 'Override Xray-core ref/tag (leave empty for latest release/tag)'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [upstream-kernel-updated]

permissions:
  contents: write
  actions: write

env:
  # Point these repository variables to your personal forks if desired:
  # Settings -> Secrets and variables -> Actions -> Variables:
  #   XRAY_RUST_REPO (default: aimalygin/xray-rust)
  #   XRAY_CORE_REPO (default: XTLS/Xray-core)
  XRAY_RUST_REPO: ${{ vars.XRAY_RUST_REPO || 'aimalygin/xray-rust' }}
  XRAY_CORE_REPO: ${{ vars.XRAY_CORE_REPO || 'XTLS/Xray-core' }}

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      rust_src: ${{ steps.src.outputs.rust_src }}
      core_src: ${{ steps.src.outputs.core_src }}
      rust_tag: ${{ steps.versions.outputs.rust_tag }}
      core_tag: ${{ steps.versions.outputs.core_tag }}
      build_rust: ${{ steps.versions.outputs.build_rust }}
      build_core: ${{ steps.versions.outputs.build_core }}
      need_release: ${{ steps.versions.outputs.need_release }}
    steps:
      - name: Resolve upstream source repositories
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolve() {
            local repo="$1"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}" | jq -r '.parent.full_name // .full_name'
          }
          RUST_SRC=$(resolve "${XRAY_RUST_REPO}")
          CORE_SRC=$(resolve "${XRAY_CORE_REPO}")
          echo "rust_src=${RUST_SRC}" >> "${GITHUB_OUTPUT}"
          echo "core_src=${CORE_SRC}" >> "${GITHUB_OUTPUT}"
          echo "xray-rust: 配置=${XRAY_RUST_REPO} 上游=${RUST_SRC}"
          echo "xray-core: 配置=${XRAY_CORE_REPO} 上游=${CORE_SRC}"

      - name: Query latest upstream / fork versions and current manifest
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          query_latest() {
            local repo="$1"
            local tag
            tag=$(curl -fsSL -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${repo}/releases/latest" 2>/dev/null \
              | jq -r '.tag_name // empty' || true)
            if [ -z "${tag}" ]; then
              tag=$(curl -fsSL -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${repo}/tags?per_page=1" 2>/dev/null \
                | jq -r '.[0].name // empty' || true)
            fi
            if [ -z "${tag}" ]; then
              tag=$(curl -fsSL -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${repo}/commits?per_page=1" 2>/dev/null \
                | jq -r '.[0].sha[0:10] // "main"' || true)
            fi
            echo "${tag}"
          }

          # 版本永远看上游（fork 不会自动同步，也拿不到上游 tag），
          # 构建时优先用配置里的 fork，若 fork 没有该 ref 则回退到上游
          RUST_SRC="${{ steps.src.outputs.rust_src }}"
          CORE_SRC="${{ steps.src.outputs.core_src }}"
          RUST_TAG="${{ github.event.inputs.xray_rust_ref }}"
          [ -n "${RUST_TAG}" ] || RUST_TAG=$(query_latest "${RUST_SRC}")
          # XTLS/Xray-core 的 v25+/v26+ tag 属于「大版本号但 module path 未加 /vN」，
          # Go 会拒绝 go get；因此 core 改为跟随上游默认分支的 commit（pseudo-version）
          CORE_TAG="${{ github.event.inputs.xray_core_ref }}"
          if [ -z "${CORE_TAG}" ]; then
            CORE_TAG=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${CORE_SRC}/commits?per_page=1" 2>/dev/null \
              | jq -r '.[0].sha[0:10] // empty' || true)
          fi
          [ -n "${CORE_TAG}" ] || CORE_TAG=$(query_latest "${CORE_SRC}")

          MANIFEST_URL="https://github.com/${{ github.repository }}/releases/download/kernels-latest/kernels-manifest.json"
          CUR_RUST=""
          CUR_CORE=""
          CUR_RUST_SHA=""
          CUR_CORE_SHA=""
          if curl -fsSL "${MANIFEST_URL}" -o /tmp/cur-manifest.json 2>/dev/null; then
            CUR_RUST=$(jq -r '.kernels[] | select(.id=="xray-rust") | .version // empty' /tmp/cur-manifest.json || true)
            CUR_CORE=$(jq -r '.kernels[] | select(.id=="xray-core") | .version // empty' /tmp/cur-manifest.json || true)
            CUR_RUST_SHA=$(jq -r '.kernels[] | select(.id=="xray-rust") | .sha256 // empty' /tmp/cur-manifest.json || true)
            CUR_CORE_SHA=$(jq -r '.kernels[] | select(.id=="xray-core") | .sha256 // empty' /tmp/cur-manifest.json || true)
          fi

          FORCE="${{ github.event.inputs.force_rebuild }}"
          BUILD_RUST="false"
          BUILD_CORE="false"
          # 版本一致但 sha256 为空，说明上次只写了 manifest 没产物，必须重建
          if [ "${FORCE}" = "true" ] || [ "${RUST_TAG}" != "${CUR_RUST}" ] || [ -z "${CUR_RUST_SHA}" ]; then
            BUILD_RUST="true"
          fi
          if [ "${FORCE}" = "true" ] || [ "${CORE_TAG}" != "${CUR_CORE}" ] || [ -z "${CUR_CORE_SHA}" ]; then
            BUILD_CORE="true"
          fi
          NEED_RELEASE="false"
          if [ "${BUILD_RUST}" = "true" ] || [ "${BUILD_CORE}" = "true" ]; then
            NEED_RELEASE="true"
          fi

          echo "xray-rust: current=${CUR_RUST:-none} target=${RUST_TAG} build=${BUILD_RUST}"
          echo "xray-core: current=${CUR_CORE:-none} target=${CORE_TAG} build=${BUILD_CORE}"
          {
            echo "rust_tag=${RUST_TAG}"
            echo "core_tag=${CORE_TAG}"
            echo "build_rust=${BUILD_RUST}"
            echo "build_core=${BUILD_CORE}"
            echo "need_release=${NEED_RELEASE}"
          } >> "${GITHUB_OUTPUT}"

  build-xray-rust:
    needs: check-upstream
    if: needs.check-upstream.outputs.build_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout way-harmonyos
        uses: actions/checkout@v4

      - name: Install Rust toolchain 1.96.0 + rust-src (aarch64-unknown-linux-ohos)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rust-src

      - name: Setup OpenHarmony Native NDK (from command-line-tools zip)
        id: ohos_ndk
        env:
          TOOLS_URL: ${{ vars.OHOS_CMDLINE_TOOLS_URL || vars.OHOS_NDK_URL }}
        run: |
          set -euo pipefail
          [ -n "${TOOLS_URL}" ] || { echo "::error::OHOS_CMDLINE_TOOLS_URL is not set"; exit 1; }
          mkdir -p "${RUNNER_TEMP}/ohos-tools"
          curl -fSL --retry 3 "${TOOLS_URL}" -o "${RUNNER_TEMP}/ohos-tools.zip"
          unzip -q "${RUNNER_TEMP}/ohos-tools.zip" -d "${RUNNER_TEMP}/ohos-tools"
          NATIVE_DIR=$(find "${RUNNER_TEMP}/ohos-tools" -type d -path '*/sdk/default/openharmony/native' | head -n 1)
          [ -n "${NATIVE_DIR}" ] || { echo "::error::native SDK not found in tools zip"; exit 1; }
          LLVM_BIN="${NATIVE_DIR}/llvm/bin"
          SYSROOT="${NATIVE_DIR}/sysroot"
          echo "llvm_bin=${LLVM_BIN}" >> "${GITHUB_OUTPUT}"
          echo "sysroot=${SYSROOT}" >> "${GITHUB_OUTPUT}"

          cat > "${RUNNER_TEMP}/ohos-clang-cc.sh" <<EOF
          #!/usr/bin/env bash
          exec "${LLVM_BIN}/clang" --target=aarch64-linux-ohos --sysroot="${SYSROOT}" "\$@"
          EOF
          cat > "${RUNNER_TEMP}/ohos-clang-cxx.sh" <<EOF
          #!/usr/bin/env bash
          exec "${LLVM_BIN}/clang++" --target=aarch64-linux-ohos --sysroot="${SYSROOT}" "\$@"
          EOF
          chmod +x "${RUNNER_TEMP}/ohos-clang-cc.sh" "${RUNNER_TEMP}/ohos-clang-cxx.sh"

      - name: Checkout xray-rust (${{ needs.check-upstream.outputs.rust_tag }})
        run: |
          set -euo pipefail
          REF="${{ needs.check-upstream.outputs.rust_tag }}"
          SRC="${{ needs.check-upstream.outputs.rust_src }}"
          DST="${RUNNER_TEMP}/xray-rust"
          clone_at() {
            local repo="$1" ref="$2" dst="$3"
            rm -rf "${dst}"
            if git clone --depth 1 --branch "${ref}" "https://github.com/${repo}.git" "${dst}" 2>/dev/null; then
              return 0
            fi
            rm -rf "${dst}"
            git clone "https://github.com/${repo}.git" "${dst}" && git -C "${dst}" checkout "${ref}"
          }
          clone_at "${XRAY_RUST_REPO}" "${REF}" "${DST}" || clone_at "${SRC}" "${REF}" "${DST}"

      - name: Apply way OHOS patch (kernel/way-ohos.patch)
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/xray-rust"
          PATCH="${GITHUB_WORKSPACE}/kernel/way-ohos.patch"
          [ -f "${PATCH}" ] || { echo "::error::kernel/way-ohos.patch not found"; exit 1; }
          git apply -v --3way "${PATCH}" || patch -p1 --forward < "${PATCH}"
          echo "patch applied"

      - name: Cross-compile libxray_ffi.a and libentry_rust.so
        env:
          # xray-rust 的 rust-toolchain.toml 钉在 1.96.0；直接用 nightly 会因新 lint
          # (trailing semicolon / fetch_update deprecated) 编译失败，
          # 所以用 stable 1.96.0 + RUSTC_BOOTSTRAP=1 解锁 -Z build-std
          RUSTC_BOOTSTRAP: "1"
          RUSTUP_TOOLCHAIN: "1.96.0"
          CC_aarch64_unknown_linux_ohos: ${{ runner.temp }}/ohos-clang-cc.sh
          CXX_aarch64_unknown_linux_ohos: ${{ runner.temp }}/ohos-clang-cxx.sh
          AR_aarch64_unknown_linux_ohos: ${{ steps.ohos_ndk.outputs.llvm_bin }}/llvm-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER: ${{ runner.temp }}/ohos-clang-cc.sh
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          CARGO_PROFILE_RELEASE_PANIC: abort
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/xray-rust"
          cargo build -Z build-std=std,panic_abort --release \
            --target aarch64-unknown-linux-ohos \
            -p xray-ffi --lib

          OUT_DIR="${GITHUB_WORKSPACE}/dist/xray-rust"
          mkdir -p "${OUT_DIR}"
          cp target/aarch64-unknown-linux-ohos/release/libxray_ffi.a "${OUT_DIR}/libxray_ffi.a"
          if [ -f crates/xray-ffi/include/xray_ffi.h ]; then
            cp crates/xray-ffi/include/xray_ffi.h "${OUT_DIR}/xray_ffi.h"
          fi

          # Link HarmonyOS NAPI wrapper into libentry_rust.so
          "${RUNNER_TEMP}/ohos-clang-cxx.sh" -shared -fPIC -O2 -std=c++17 \
            -I"${GITHUB_WORKSPACE}/app/entry/src/main/cpp/include" \
            -I"${{ steps.ohos_ndk.outputs.sysroot }}/usr/include" \
            "${GITHUB_WORKSPACE}/app/entry/src/main/cpp/xray_napi.cpp" \
            -Wl,--whole-archive "${OUT_DIR}/libxray_ffi.a" -Wl,--no-whole-archive \
            -L"${{ steps.ohos_ndk.outputs.sysroot }}/usr/lib/aarch64-linux-ohos" \
            -lace_napi.z -lhilog_ndk.z -lc++_shared \
            -Wl,--gc-sections -Wl,--exclude-libs,ALL -Wl,-O2 -Wl,--strip-all \
            -o "${OUT_DIR}/libentry_rust.so"

          # Sanity-check exported NAPI registration & absence of unexpected dynamic deps
          "${{ steps.ohos_ndk.outputs.llvm_bin }}/llvm-readelf" -d "${OUT_DIR}/libentry_rust.so" | grep -E 'NEEDED|SONAME' || true
          sha256sum "${OUT_DIR}/libentry_rust.so" > "${OUT_DIR}/libentry_rust.so.sha256"

      - name: Upload xray-rust artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-xray-rust
          path: dist/xray-rust/libentry_rust.so*

  build-xray-core:
    needs: check-upstream
    if: needs.check-upstream.outputs.build_core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout way-harmonyos
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup OpenHarmony Native NDK (from command-line-tools zip)
        id: ohos_ndk
        env:
          TOOLS_URL: ${{ vars.OHOS_CMDLINE_TOOLS_URL || vars.OHOS_NDK_URL }}
        run: |
          set -euo pipefail
          [ -n "${TOOLS_URL}" ] || { echo "::error::OHOS_CMDLINE_TOOLS_URL is not set"; exit 1; }
          mkdir -p "${RUNNER_TEMP}/ohos-tools"
          curl -fSL --retry 3 "${TOOLS_URL}" -o "${RUNNER_TEMP}/ohos-tools.zip"
          unzip -q "${RUNNER_TEMP}/ohos-tools.zip" -d "${RUNNER_TEMP}/ohos-tools"
          NATIVE_DIR=$(find "${RUNNER_TEMP}/ohos-tools" -type d -path '*/sdk/default/openharmony/native' | head -n 1)
          [ -n "${NATIVE_DIR}" ] || { echo "::error::native SDK not found in tools zip"; exit 1; }
          LLVM_BIN="${NATIVE_DIR}/llvm/bin"
          SYSROOT="${NATIVE_DIR}/sysroot"
          echo "llvm_bin=${LLVM_BIN}" >> "${GITHUB_OUTPUT}"
          echo "sysroot=${SYSROOT}" >> "${GITHUB_OUTPUT}"

          cat > "${RUNNER_TEMP}/ohos-clang-cc.sh" <<EOF
          #!/usr/bin/env bash
          exec "${LLVM_BIN}/clang" --target=aarch64-linux-ohos --sysroot="${SYSROOT}" "\$@"
          EOF
          cat > "${RUNNER_TEMP}/ohos-clang-cxx.sh" <<EOF
          #!/usr/bin/env bash
          exec "${LLVM_BIN}/clang++" --target=aarch64-linux-ohos --sysroot="${SYSROOT}" "\$@"
          EOF
          chmod +x "${RUNNER_TEMP}/ohos-clang-cc.sh" "${RUNNER_TEMP}/ohos-clang-cxx.sh"

      - name: Cross-compile XTLS/Xray-core Go C-ABI shared library (${{ needs.check-upstream.outputs.core_tag }})
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: arm64
          CC: ${{ runner.temp }}/ohos-clang-cc.sh
          CGO_CFLAGS: "-O2 -D__OHOS__"
          CGO_LDFLAGS: "-Wl,-z,max-page-size=16384 -Wl,--strip-all"
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/app/native/xray-go-bridge"
          CORE_TAG="${{ needs.check-upstream.outputs.core_tag }}"
          # Support both official XTLS/Xray-core and user forks via go.mod replace
          CORE_SRC="${{ needs.check-upstream.outputs.core_src }}"
          # 先用上游 commit（pseudo-version）；失败则退回配置的 fork
          if ! go get "github.com/xtls/xray-core@${CORE_TAG}" 2>/tmp/goget.err; then
            echo "go get ${CORE_SRC}@${CORE_TAG} failed:"; cat /tmp/goget.err
            echo "fallback -> ${XRAY_CORE_REPO}@${CORE_TAG}"
            go mod edit -replace "github.com/xtls/xray-core=github.com/${XRAY_CORE_REPO}@${CORE_TAG}"
          fi
          go mod tidy

          OUT_DIR="${GITHUB_WORKSPACE}/dist/xray-core"
          mkdir -p "${OUT_DIR}"
          go build -trimpath -buildmode=c-shared \
            -ldflags="-s -w -X main.coreVersion=${CORE_TAG}" \
            -o "${OUT_DIR}/libxray_core_ohos.so" .

          "${{ steps.ohos_ndk.outputs.llvm_bin }}/llvm-readelf" -d "${OUT_DIR}/libxray_core_ohos.so" | grep -E 'NEEDED|SONAME' || true
          sha256sum "${OUT_DIR}/libxray_core_ohos.so" > "${OUT_DIR}/libxray_core_ohos.so.sha256"

      - name: Upload Xray-core artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-xray-core
          path: dist/xray-core/libxray_core_ohos.so*

  publish-kernels:
    needs: [check-upstream, build-xray-rust, build-xray-core]
    if: always() && needs.check-upstream.outputs.need_release == 'true' && (needs.build-xray-rust.result == 'success' || needs.build-xray-core.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout way-harmonyos
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate kernels-manifest.json and publish kernels-latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/kernels-latest"

          # Preserve previous asset if only one of the two cores was rebuilt
          if curl -fsSL "${BASE_URL}/kernels-manifest.json" -o /tmp/prev-manifest.json 2>/dev/null; then
            echo "Loaded existing kernels-manifest.json"
          else
            echo '{"schemaVersion":1,"kernels":[]}' > /tmp/prev-manifest.json
          fi

          RUST_SHA=""
          if [ -f release-assets/libentry_rust.so.sha256 ]; then
            RUST_SHA=$(awk '{print $1}' release-assets/libentry_rust.so.sha256)
          else
            RUST_SHA=$(jq -r '.kernels[] | select(.id=="xray-rust") | .sha256 // ""' /tmp/prev-manifest.json)
          fi

          CORE_SHA=""
          if [ -f release-assets/libxray_core_ohos.so.sha256 ]; then
            CORE_SHA=$(awk '{print $1}' release-assets/libxray_core_ohos.so.sha256)
          else
            CORE_SHA=$(jq -r '.kernels[] | select(.id=="xray-core") | .sha256 // ""' /tmp/prev-manifest.json)
          fi

          jq -n \
            --arg builtAt "${BUILT_AT}" \
            --arg rustVer "${{ needs.check-upstream.outputs.rust_tag }}" \
            --arg rustSha "${RUST_SHA}" \
            --arg rustUrl "${BASE_URL}/libentry_rust.so" \
            --arg coreVer "${{ needs.check-upstream.outputs.core_tag }}" \
            --arg coreSha "${CORE_SHA}" \
            --arg coreUrl "${BASE_URL}/libxray_core_ohos.so" \
            '{
              schemaVersion: 1,
              updatedAt: $builtAt,
              kernels: [
                {
                  id: "xray-rust",
                  version: $rustVer,
                  sha256: $rustSha,
                  assetUrl: $rustUrl,
                  builtAt: $builtAt
                },
                {
                  id: "xray-core",
                  version: $coreVer,
                  sha256: $coreSha,
                  assetUrl: $coreUrl,
                  builtAt: $builtAt
                }
              ]
            }' > release-assets/kernels-manifest.json

          cat release-assets/kernels-manifest.json

          if gh release view kernels-latest >/dev/null 2>&1; then
            gh release upload kernels-latest release-assets/* --clobber
          else
            gh release create kernels-latest release-assets/* \
              --title "Auto-Built HarmonyOS Kernels (xray-rust + Xray-core)" \
              --notes "Automatically built arm64-v8a kernels for way-harmonyos. App automatically rolls back to the previous working kernel if any error occurs."
          fi

      - name: Trigger automatic HAP packaging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-way-hap.yml --ref main || true
